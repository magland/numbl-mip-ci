<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>numbl &times; mip-core compatibility</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>numbl &times; mip-core compatibility</h1>
      <p id="meta" class="meta">Loading report&hellip;</p>
    </header>

    <main>
      <section id="summary" class="summary"></section>
      <section id="filters" class="filters"></section>
      <section class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th>Package</th>
              <th>Outcome</th>
              <th>install</th>
              <th>load</th>
              <th>test</th>
              <th>unload</th>
              <th>uninstall</th>
              <th>time</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </main>

    <footer>
      <p>
        Each package is run through <code>mip install &rarr; load &rarr; test &rarr; unload &rarr; uninstall</code>
        inside a single numbl process. Generated by
        <a href="https://github.com/magland/numbl-mip-ci">numbl-mip-ci</a>.
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
